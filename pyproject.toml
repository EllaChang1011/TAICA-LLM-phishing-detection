[project]
name = "phishing-detection"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # demo
    "streamlit",
    "chromadb",
    # Pinned to the versions the model was trained and evaluated with (logs/train.log).
    # torch must stay on the CUDA 12.4 build that matches torchvision 0.21.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "sentence-transformers==6.2.0",
    "pymupdf",
    "beautifulsoup4",
    "lxml",
    "huggingface-hub",
    "requests",
]

[project.optional-dependencies]
train = [
    "unsloth==2026.5.8",
    "unsloth-zoo==2026.5.4",
    "xformers==0.0.28.post2",
    "transformers==5.9.0",
    "peft==0.19.1",
    "trl==0.24.0",
    "datasets",
    "bitsandbytes==0.49.2",
    "accelerate==1.13.0",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pandas",
]
export = [
    "gguf>=0.19.0",
    "protobuf>=7.35.0",
    "sentencepiece>=0.2.1",
]

[tool.uv]
# Only resolve for the Linux GPU box this project runs on
environments = ["sys_platform == 'linux'"]
# unsloth 2026.5.8 declares transformers<=5.5.0, but training actually ran on
# 5.9.0 (logs/train.log); xformers 0.0.28.post2 declares torch==2.5.0 but ran next
# to torch 2.6.0 (unused: "Xformers = None" in train.log). Override so the lock
# records the combination that actually trained the model.
# unsloth-zoo declares torchao, but the training env never had it and torchao 0.18
# needs a newer torch; the never-true marker keeps it out of the lock.
override-dependencies = [
    "transformers==5.9.0",
    "torch==2.6.0",
    "torchao; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
# Exact builds the training run used (see uv pip freeze before the lock rebuild)
unsloth = { git = "https://github.com/unslothai/unsloth.git", rev = "8ec9a74fd35afe410b943b504470d4bcd089ec97" }
xformers = { url = "https://download.pytorch.org/whl/cu121/xformers-0.0.28.post2-cp311-cp311-manylinux_2_28_x86_64.whl" }
