[project]
name = "phishing-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # demo
    "streamlit",
    "chromadb",
    "sentence-transformers",
    "pymupdf",
    "beautifulsoup4",
    "lxml",
    "huggingface-hub",
    "requests",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "bitsandbytes",
    "accelerate",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pandas",
]
export = [
    "gguf>=0.19.0",
    "protobuf>=7.35.0",
    "sentencepiece>=0.2.1",
]
